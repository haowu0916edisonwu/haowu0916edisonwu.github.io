name: Synchronize publication statuses
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update-homepage-once.py'
      - '.github/workflows/update-homepage-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update publication sections without changing the design
        run: python .github/scripts/update-homepage-once.py
      - name: Save homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show TMLR acceptance, TACL review and CENTRE revision in both languages'
          git push origin HEAD:main
